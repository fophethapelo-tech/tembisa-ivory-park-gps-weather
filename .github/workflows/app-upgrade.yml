name: Apply navigation address upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/navigation_address_upgrade.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: python3 scripts/navigation_address_upgrade.py
      - name: Commit upgraded app
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add personalized navigation voice and address formatting'
          git push
